plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5' apply false
    id 'io.spring.dependency-management' version '1.1.5' apply false
}

allprojects {
    group = 'com.example.executioncore'
    version = '1.0.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17) // or 21
        }
    }

    dependencies {
        // Shared compile/test dependencies across all subprojects if needed
        testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    test {
        useJUnitPlatform()
    }
}

// Apply publishing plugin ONLY to library modules (excluding sample-app)
configure([project(':execution-core'), project(':execution-core-spring-boot-starter')]) {
    apply plugin: 'maven-publish'
}