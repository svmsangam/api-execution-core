dependencies {
    // Shared domain interfaces
    implementation project(':execution-core')

    // Import the test-fixtures published by execution-core
    testImplementation testFixtures(project(':execution-core'))

    // Spring Data Redis marked compileOnly
    compileOnly 'org.springframework.boot:spring-boot-starter-data-redis:3.2.4'

    // Driver required for running unit/integration tests within this module
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis:3.2.4'
}