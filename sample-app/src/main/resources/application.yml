server:
  port: 8080

spring:
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

execution:
  core:
    enabled: true
    storage-type: spring_data
    rate-limiter:
      enabled: true
      algorithm: sliding_window
      sliding-window:
        default-capacity: 5
        default-window: 10s
    idempotency:
      enabled: true
      key-prefix: "sample:idempotency:"
      default-lock-ttl: 15s
      default-retention-ttl: 5m